name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  repository_dispatch:
    types: [release-prepared]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [current, patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: bump version
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version || steps.current.outputs.version }}
      tag: ${{ steps.bump.outputs.tag || steps.current.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      previous: ${{ steps.previous.outputs.tag }}
      skip: ${{ steps.kind.outputs.skip }}
      pr: ${{ github.event.client_payload.pr || github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sha || 'main' }}
          fetch-depth: 0
      - name: Verify prepared release commit is on main
        if: github.event_name == 'repository_dispatch'
        env:
          PREPARED_SHA: ${{ github.event.client_payload.sha }}
        run: |
          if [[ ! "$PREPARED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The prepared release SHA is invalid"
            exit 1
          fi
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$PREPARED_SHA" ]; then
            echo "::error::The checked-out commit does not match the prepared release"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$actual_sha" FETCH_HEAD; then
            echo "::error::The prepared release commit is not on main"
            exit 1
          fi
      - name: Select release kind
        id: kind
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          DISPATCH: ${{ inputs.bump }}
          PREPARED: ${{ github.event_name == 'repository_dispatch' }}
        run: |
          if [ "$PREPARED" = true ]; then kind=current
          elif [ -n "$DISPATCH" ]; then kind="$DISPATCH"
          else kind="$(python3 scripts/release/select_bump.py)"
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [ "$kind" = none ]; then echo 'skip=true' >> "$GITHUB_OUTPUT"; else echo 'skip=false' >> "$GITHUB_OUTPUT"; fi
      - name: Find previous release
        id: previous
        if: steps.kind.outputs.skip != 'true'
        run: echo "tag=$(git tag --list 'v*' --sort=-v:refname | head -1)" >> "$GITHUB_OUTPUT"
      - name: Bump version
        id: bump
        if: steps.kind.outputs.skip != 'true' && steps.kind.outputs.kind != 'current'
        run: python3 scripts/release/bump_version.py "${{ steps.kind.outputs.kind }}"
      - name: Use current version
        id: current
        if: steps.kind.outputs.kind == 'current'
        run: |
          version="$(python3 scripts/release/bump_version.py --show)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Commit and push version
        id: push
        if: steps.kind.outputs.skip != 'true' && steps.kind.outputs.kind != 'current'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml uv.lock soundslo/__init__.py app/package.json app/package-lock.json
          git commit -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main
      - name: Select release commit
        id: release
        if: steps.kind.outputs.skip != 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  dispatch:
    name: start trusted release builds
    needs: prepare
    if: github.event_name == 'pull_request' && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch prepared commit from main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          PR: ${{ needs.prepare.outputs.pr }}
        run: |
          jq -n \
            --arg sha "$RELEASE_SHA" \
            --arg pr "$PR" \
            '{event_type: "release-prepared", client_payload: {sha: $sha, pr: $pr}}' \
            > "$RUNNER_TEMP/release-dispatch.json"
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            --input "$RUNNER_TEMP/release-dispatch.json"

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    if: github.event_name != 'pull_request' && needs.prepare.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            runner: macos-15
          - target: win-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/cache@v6
        with:
          path: .cache/package
          key: desktop-${{ matrix.target }}-${{ hashFiles('scripts/package/**', 'pyproject.toml') }}
      - name: Install Electron dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Package signed and notarized macOS app
        if: matrix.target == 'mac-arm64'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPECTED_TEAM_ID: KMZ785G889
          PYTHONUTF8: '1'
        run: |
          for value in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!value}" ]; then echo "::error::$value is required for signed and notarized macOS releases"; exit 1; fi
          done
          if [ "$APPLE_TEAM_ID" != "$EXPECTED_TEAM_ID" ]; then echo "::error::APPLE_TEAM_ID does not match Soundslo's Apple team"; exit 1; fi
          python scripts/package/build.py --target mac-arm64 --notarize
      - name: Package Windows app
        if: matrix.target == 'win-x64'
        shell: bash
        env:
          PYTHONUTF8: '1'
        run: python scripts/package/build.py --target win-x64
      - name: Verify macOS signature and notarization
        if: matrix.target == 'mac-arm64'
        shell: bash
        env:
          EXPECTED_TEAM_ID: KMZ785G889
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: scripts/package/verify_macos_artifacts.sh
      - name: Smoke test package
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "win-x64" ]; then
            exe=$(find app/dist -name 'Soundslo.exe' -path '*win-unpacked*' | head -1)
          else
            exe=$(find app/dist -path '*/Soundslo.app/Contents/MacOS/Soundslo' -type f | head -1)
          fi
          test -n "$exe"
          "$exe" --smoke
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out-dist
          find app/dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*setup.exe' \) -exec cp {} out-dist/ \;
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}
          path: out-dist/*
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish release
    needs: [prepare, build]
    if: always() && needs.prepare.result == 'success' && needs.build.result == 'success' && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: incoming
          pattern: build-*
      - name: Gather, alias, and checksum
        run: |
          mkdir -p release
          find incoming -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*setup.exe' \) -exec mv {} release/ \;
          cp "release/Soundslo-${{ needs.prepare.outputs.version }}-mac-arm64.dmg" release/Soundslo-mac-arm64.dmg
          cp "release/Soundslo-${{ needs.prepare.outputs.version }}-win-x64-setup.exe" release/Soundslo-win-x64-setup.exe
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Build release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.prepare.outputs.pr }}
        run: |
          if [ -n "$PR" ]; then gh api "repos/${{ github.repository }}/pulls/$PR" > pr.json; fi
          python3 scripts/release/release_notes.py ${PR:+--pr pr.json} --version "${{ needs.prepare.outputs.version }}" --previous "${{ needs.prepare.outputs.previous }}" --repo "${{ github.repository }}" --files release --output notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" --repo "${{ github.repository }}" --target "${{ needs.prepare.outputs.sha }}" --title "${{ needs.prepare.outputs.tag }}" --notes-file notes.md --latest release/*
      - name: Move rolling latest tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f latest "${{ needs.prepare.outputs.sha }}"
          git push -f origin latest
