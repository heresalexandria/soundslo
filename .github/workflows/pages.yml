name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/assets/soundslo-app.jpg', 'soundslo/static/apple-touch-icon.png', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Assemble static download site
        run: |
          mkdir -p _site/img
          cp -R site/. _site/
          cp docs/assets/soundslo-app.jpg _site/img/app.jpg
          cp soundslo/static/apple-touch-icon.png _site/img/icon.png
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
