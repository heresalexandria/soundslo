[project]
name = "soundslo"
version = "0.2.3"
description = "A local-first music and sound-effects workbench for macOS and Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "licenses/*"]
requires-python = ">=3.11"
keywords = ["audio", "electron", "foley", "generative-ai", "mlx", "music", "stable-audio", "tflite"]
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "imageio-ffmpeg>=0.6,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soundslo"]
